<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>予定入れていい？チェック</title>
 <style>
  body {
    font-family: sans-serif;
    background: #f7f7f7;
    padding: 24px;
  }

  .box {
    max-width: 480px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
  }

  select, button {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    font-size: 16px;
  }

  .result {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    background: #eef;
    font-weight: bold;
    text-align: center;
  }

  /* 👇 スマホ用 */
  @media (max-width: 600px) {
    body {
      padding: 12px;
    }

    .box {
      padding: 16px;
      border-radius: 8px;
    }

    h2 {
      font-size: 20px;
    }

    select, button {
      font-size: 18px; /* タップしやすく */
      padding: 14px;
    }
  }

  .spinner {
  width: 32px;
  height: 32px;
  border: 4px solid #ddd;
  border-top: 4px solid #555;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

</style>

</head>
<body>

<div class="box">
  <h2>予定入れていい？</h2>

  <label>① それは義務？</label>
  <select id="duty">
    <option value="">選んでください</option>
    <option value="yes">はい（仕事・約束）</option>
    <option value="no">いいえ</option>
  </select>

  <label>② 本音は？</label>
  <select id="feeling">
    <option value="">選んでください</option>
    <option value="want">正直やりたい</option>
    <option value="neutral">どちらでも</option>
    <option value="dont">あまりやりたくない</option>
  </select>

  <label>③ 断ったら困る？</label>
  <select id="risk">
    <option value="">選んでください</option>
    <option value="high">結構困る</option>
    <option value="low">あまり困らない</option>
  </select>

  <label>④ 今の余裕</label>
  <select id="energy">
    <option value="">選んでください</option>
    <option value="high">余裕あり</option>
    <option value="mid">普通</option>
    <option value="low">しんどい</option>
  </select>

  <button onclick="judge()">判定する</button>
  <!-- ローディング -->
<div id="loading" style="display:none; text-align:center; margin-top:16px;">
  <div class="spinner"></div>
  <div style="margin-top:8px; font-size:14px;">
    状況を整理しています…
  </div>
</div>

<!-- 判定結果 -->
  <div id="result" class="result"></div>

</div>

<script>
function judge() {
  const duty = document.getElementById("duty").value;
  const feeling = document.getElementById("feeling").value;
  const risk = document.getElementById("risk").value;
  const energy = document.getElementById("energy").value;

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");

  if (!duty || !feeling || !risk || !energy) {
  result.textContent = "全部選んでね。";
  result.style.background = "#ffe0e0"; // 赤っぽく
  return;
}

  // 表示リセット
result.textContent = "";
result.style.background = "#eef"; 
loading.style.display = "block";

  setTimeout(() => {
    let score = 0;

    if (duty === "yes") score += 2;
    if (feeling === "want") score += 2;
    if (feeling === "dont") score -= 2;
    if (risk === "high") score += 2;
    if (energy === "high") score += 1;
    if (energy === "low") score -= 2;

    // グルグル終了
    loading.style.display = "none";

    // 判定結果
    if (score >= 3) {
      result.textContent = "👉 入れてOK";
      result.style.background = "#e0f0ff";
    } else if (score <= -2) {
      result.textContent = "👉 今回は断ってOK";
      result.style.background = "#eee";
    } else {
      result.textContent = "👉 保留が正解";
      result.style.background = "#fff4cc";
    }

  }, 400);
}
</script>

</body>
</html>
